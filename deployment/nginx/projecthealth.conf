upstream projecthealth_backend {
  server 127.0.0.1:4174;
}

server {
  listen 80;
  listen [::]:80;
  server_name projecthealth.com www.projecthealth.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://www.projecthealth.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name projecthealth.com;

  ssl_certificate /etc/letsencrypt/live/www.projecthealth.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.projecthealth.com/privkey.pem;

  return 301 https://www.projecthealth.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.projecthealth.com;

  ssl_certificate /etc/letsencrypt/live/www.projecthealth.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.projecthealth.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://projecthealth_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
